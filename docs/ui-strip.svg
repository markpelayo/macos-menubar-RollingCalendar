<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="-apple-system, SF Pro Text, Helvetica, Arial, sans-serif">
  <style>
    .lbl   { font-size: 11px; fill: #6b7280; }
    .lblb  { font-size: 11px; fill: #374151; font-weight: 600; }
    .gutter{ font-size: 12px; fill: #111827; }
    .count { font-size: 12px; fill: #111827; }
    .lead  { stroke: #9ca3af; stroke-width: 1; }
  </style>

  <!-- ============ menu bar ============ -->
  <rect x="20" y="46" width="840" height="26" rx="4" fill="#e8dcc0"/>

  <!-- left gutter: 🔴(2) name (time left) — badge flush with the outer edge -->
  <circle cx="28" cy="59" r="5" fill="#e02020"/>
  <text class="count"  x="36"  y="63">(2)</text>
  <text class="gutter" x="212" y="63" text-anchor="end">Vendor Call (59m)</text>

  <!-- right gutter: (length) name 🔴(2) -->
  <text class="gutter" x="638" y="63">(2h15) ZD Chat+Email</text>
  <circle cx="806" cy="59" r="5" fill="#e02020"/>
  <text class="count"  x="814" y="63">(2)</text>

  <!-- ---- PAST: same colours lightened, lighter outline, no text inside ---- -->
  <g stroke="#000" stroke-opacity="0.25" stroke-width="1">
    <rect x="220" y="49.5" width="70"  height="19" rx="9.5" fill="#3f51b5" fill-opacity="0.38"/>
    <rect x="291" y="49.5" width="56"  height="19" rx="9.5" fill="#0b8043" fill-opacity="0.38"/>
    <rect x="348" y="49.5" width="66"  height="19" rx="9.5" fill="#039be5" fill-opacity="0.38"/>
  </g>

  <!-- ---- CURRENT: straddles now — elapsed part paler with a lighter outline,
            remaining part solid with a darker one ---- -->
  <clipPath id="clipPast"><rect x="415" y="46" width="7" height="26"/></clipPath>
  <clipPath id="clipFuture"><rect x="422" y="46" width="120" height="26"/></clipPath>
  <rect x="415" y="49.5" width="118" height="19" rx="9.5" fill="#f6c026" fill-opacity="0.95"/>
  <g clip-path="url(#clipPast)">
    <rect x="415" y="49.5" width="118" height="19" rx="9.5" fill="#f6c026" fill-opacity="0.35"
          stroke="#000" stroke-opacity="0.25"/>
  </g>
  <g clip-path="url(#clipFuture)">
    <rect x="415" y="49.5" width="118" height="19" rx="9.5" fill="none"
          stroke="#000" stroke-opacity="0.6"/>
  </g>

  <!-- ---- FUTURE: full strength, darker outline ---- -->
  <g stroke="#000" stroke-opacity="0.6" stroke-width="1">
    <rect x="534" y="49.5" width="52" height="19" rx="9.5" fill="#f5511d" fill-opacity="0.95"/>
    <rect x="587" y="49.5" width="43" height="19" rx="9.5" fill="#039be5" fill-opacity="0.95"/>
  </g>

  <!-- ---- now line: 4 pt, with a halo so it survives any block colour ---- -->
  <rect x="416" y="46" width="6" height="26" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="417" y="46" width="4" height="26" fill="#e02020"/>

  <!-- ============ annotations ============ -->
  <path class="lead" d="M34 40 L34 26 L96 26" fill="none"/>
  <text class="lblb" x="102" y="24">🔴 on the left = live clash</text>
  <text class="lbl" x="102" y="37">two things want you right now</text>

  <path class="lead" d="M812 40 L812 26 L700 26" fill="none"/>
  <text class="lblb" x="694" y="24" text-anchor="end">🔴 on the right = still ahead</text>

  <path class="lead" d="M170 78 L170 96 L238 96" fill="none"/>
  <text class="lblb" x="244" y="94">Current block + time left</text>
  <text class="lbl" x="244" y="107">turns red in the final two minutes</text>

  <path class="lead" d="M419 78 L419 128 L479 128" fill="none"/>
  <text class="lblb" x="485" y="126">Now</text>
  <text class="lbl" x="485" y="139">fixed at centre; blocks slide left past it</text>

  <path class="lead" d="M380 78 L380 160 L440 160" fill="none"/>
  <text class="lblb" x="446" y="158">Past — paler, lighter outline</text>
  <text class="lbl" x="446" y="171">no text inside: the names live in the gutters</text>

  <path class="lead" d="M470 78 L470 192 L530 192" fill="none"/>
  <text class="lblb" x="536" y="190">A block in progress fades from the left</text>
  <text class="lbl" x="536" y="203">elapsed part pale, remaining part solid</text>

  <text class="lbl" x="220" y="228">← 2 hours of past</text>
  <text class="lbl" x="630" y="228" text-anchor="end">2 hours of future →</text>
  <line x1="220" y1="234" x2="630" y2="234" stroke="#d1d5db" stroke-width="1"/>
  <text class="lbl" x="425" y="248" text-anchor="middle">250 pt by default — both range and width are set from the menu</text>
</svg>
