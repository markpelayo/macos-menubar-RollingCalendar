<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="-apple-system, SF Pro Text, Helvetica, Arial, sans-serif">
  <style>
    .row  { font-size: 13px; fill: #1f2937; }
    .dim  { font-size: 13px; fill: #9ca3af; }
    .now  { font-size: 13px; fill: #0b8043; font-weight: 600; }
    .hdr  { font-size: 13px; fill: #9ca3af; }
    .key  { font-size: 13px; fill: #9ca3af; }
    .note { font-size: 11px; fill: #6b7280; }
    .noteb{ font-size: 11px; fill: #374151; font-weight: 600; }
    .lead { stroke: #d1d5db; stroke-width: 1; }
    .sep  { stroke: #e5e7eb; stroke-width: 1; }
  </style>

  <rect x="16" y="16" width="400" height="608" rx="10" fill="#f7f7f8" stroke="#e5e7eb"/>

  <text class="hdr" x="34" y="42">Wednesday, 19 August 2026</text>
  <text class="row" x="34" y="66">Debug Time…</text>
  <line class="sep" x1="26" y1="78" x2="406" y2="78"/>

  <!-- today's events, with colour swatches -->
  <rect x="34" y="90" width="10" height="10" rx="2.5" fill="#039be5"/>
  <text class="dim" x="54" y="100">8:00 AM – 9:00 AM   Deep Work</text>

  <rect x="34" y="114" width="10" height="10" rx="2.5" fill="#f6c026"/>
  <text class="now" x="54" y="124">▶︎ 9:00 AM – 10:00 AM   Vendor Call</text>

  <rect x="34" y="138" width="10" height="10" rx="2.5" fill="#8e24aa"/>
  <text class="now" x="54" y="148">▶︎ 9:00 AM – 6:00 PM   Out of office</text>

  <rect x="34" y="162" width="10" height="10" rx="2.5" fill="#f5511d"/>
  <text class="row" x="54" y="172">10:00 AM – 10:15 AM   Break</text>

  <rect x="34" y="186" width="10" height="10" rx="2.5" fill="#0b8043"/>
  <text class="row" x="54" y="196">10:15 AM – 12:30 PM   Focus Work</text>

  <text class="dim" x="54" y="220">⋯</text>

  <line class="sep" x1="26" y1="236" x2="406" y2="236"/>
  <text class="hdr" x="34" y="256">Updated 9:04:12 AM</text>
  <text class="row" x="34" y="280">Refresh Now</text>
  <text class="key" x="380" y="280" text-anchor="end">⌘R</text>

  <!-- appearance -->
  <line class="sep" x1="26" y1="294" x2="406" y2="294"/>
  <text class="row" x="34" y="314">Time Range</text>
  <text class="key" x="380" y="314" text-anchor="end">▸</text>
  <text class="row" x="34" y="338">Timeline Width</text>
  <text class="key" x="380" y="338" text-anchor="end">▸</text>
  <text class="row" x="34" y="362">Labels</text>
  <text class="key" x="380" y="362" text-anchor="end">▸</text>
  <text class="row" x="34" y="386">Label Length</text>
  <text class="key" x="380" y="386" text-anchor="end">▸</text>
  <text class="dim" x="34" y="410">Restore Defaults</text>

  <!-- source -->
  <line class="sep" x1="26" y1="424" x2="406" y2="424"/>
  <text class="hdr" x="34" y="444">Calendar: Work (public feed)</text>
  <text class="row" x="34" y="468">Demo Mode</text>
  <text class="row" x="34" y="492">Set Up Google Sign-In…</text>
  <text class="row" x="34" y="516">Saved Calendars</text>
  <text class="key" x="380" y="516" text-anchor="end">▸</text>
  <text class="row" x="34" y="540">Copy Feed URL</text>
  <text class="row" x="34" y="564">Open Google Calendar</text>

  <line class="sep" x1="26" y1="578" x2="406" y2="578"/>
  <text class="row" x="34" y="598">Quit</text>
  <text class="key" x="380" y="598" text-anchor="end">⌘Q</text>

  <!-- ===== the Saved Calendars submenu, flown out ===== -->
  <rect x="470" y="496" width="250" height="118" rx="10" fill="#f7f7f8" stroke="#e5e7eb"/>
  <circle cx="486" cy="516" r="3.5" fill="#1f2937"/>
  <text class="row" x="500" y="520">Work</text>
  <text class="dim" x="668" y="520">✏️</text>
  <text class="dim" x="694" y="520">✕</text>
  <text class="row" x="500" y="544">Personal</text>
  <text class="dim" x="668" y="544">✏️</text>
  <text class="dim" x="694" y="544">✕</text>
  <text class="row" x="500" y="568">Team on-call</text>
  <text class="dim" x="668" y="568">✏️</text>
  <text class="dim" x="694" y="568">✕</text>
  <line class="sep" x1="480" y1="580" x2="710" y2="580"/>
  <text class="row" x="500" y="600">Add Calendar…</text>
  <path class="lead" d="M416 516 L470 516" fill="none"/>

  <!-- annotations -->
  <path class="lead" d="M320 66 L450 66" fill="none"/>
  <text class="noteb" x="458" y="63">Debug Time</text>
  <text class="note" x="458" y="77">jump to any moment to see how it looks</text>

  <path class="lead" d="M320 95 L450 95" fill="none"/>
  <text class="noteb" x="458" y="105">Colour swatches</text>
  <text class="note" x="458" y="119">match the capsules on the strip</text>

  <path class="lead" d="M320 136 L450 136" fill="none"/>
  <text class="noteb" x="458" y="147">Both current blocks marked ▶︎</text>
  <text class="note" x="458" y="161">the strip labels whichever ends soonest;</text>
  <text class="note" x="458" y="175">the dropdown always lists every one</text>

  <path class="lead" d="M320 314 L450 314" fill="none"/>
  <text class="noteb" x="458" y="311">Time Range</text>
  <text class="note" x="458" y="325">±5 min to ±2 hours</text>

  <path class="lead" d="M320 338 L450 338" fill="none"/>
  <text class="noteb" x="458" y="349">Timeline Width</text>
  <text class="note" x="458" y="363">100–450 pt; each option shows the</text>
  <text class="note" x="458" y="377">block size it implies</text>

  <path class="lead" d="M320 362 L450 362" fill="none"/>
  <text class="noteb" x="458" y="401">Labels · Label Length</text>
  <text class="note" x="458" y="415">which parts to show, and where</text>
  <text class="note" x="458" y="429">names start being shortened</text>

  <path class="lead" d="M320 410 L450 410" fill="none"/>
  <text class="noteb" x="458" y="453">Restore Defaults</text>
  <text class="note" x="458" y="467">greyed out until something changes</text>

  <path class="lead" d="M600 490 L600 470 L470 470" fill="none"/>
  <text class="noteb" x="464" y="460" text-anchor="end">Saved Calendars</text>
  <text class="note" x="464" y="474" text-anchor="end">bullet marks the one in use;</text>
  <text class="note" x="464" y="488" text-anchor="end">pencil renames, ✕ removes</text>
</svg>
